name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artextest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare the explicit security test database
        env:
          PGPASSWORD: testpass
        # Most packages create suffixed fixture databases in TestMain. The
        # offline CLI deliberately requires its configured database to exist.
        run: |
          psql --version
          psql -X --no-password --host localhost --username artex --dbname artextest \
            --set ON_ERROR_STOP=1 --command 'CREATE DATABASE artextest_security'
      - id: build
        run: go build ./...
      - run: go vet ./...
      # Skipped tests, tracked in issue #9:
      # - TestInterceptFilterHTTP, TestGraphOverviewExpandsAssociatedCompanyScope,
      #   TestCaptureApprovalLifecycle: fail on unmodified upstream code with a
      #   fresh database.
      # - TestSideUsageRecordedOnceOnConsumerCancellation: concurrency/cancellation
      #   test that passes locally but is timing-sensitive on 2-core CI runners.
      # They now skip themselves in code (t.Skip with a pointer to the issue).
      - name: go test
        # -p 1: package test suites share the single postgres service; running
        # them in parallel makes packages delete each other's rows (observed
        # as rotating failures in the agent package). Serial package execution
        # keeps the database state deterministic.
        run: go test -p 1 ./...
      - name: go test -race
        # Race detector on the packages that pass under -race today. ./server is
        # left out until it has been checked with -race against postgres.
        # Its own database: the plain run above leaves rows behind and the db tests
        # are not idempotent across runs (duplicate llm_profiles names).
        env:
          ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest_race?sslmode=disable

        run: >-
          go test -race -p 1 ./agent ./cmd/artex ./config ./db ./evidence ./guard
          ./intercept ./llmpool ./llmrec ./mcphttp ./notify ./sidequestion ./traffic

      - name: Verify security boundaries against PostgreSQL without skipped coverage
        # Keep this required gate observable even when an unrelated legacy test
        # fails earlier. The job still fails for any failed step; nothing is ignored.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest_security?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=12m -json -p 1 ./db ./agent ./server ./cmd/artex-security \
            -run '^Test(AuthSession|ExecutionBoundary|WorkspaceSecurity|ChatUploadSecurity)' \
            | tee "$RUNNER_TEMP/artex-security-tests.jsonl"
          python3 - "$RUNNER_TEMP/artex-security-tests.jsonl" <<'PY'
          import json
          import re
          import sys

          expected = {
              ("db", "AuthSession"),
              ("artex-security", "AuthSession"),
              ("agent", "ExecutionBoundary"),
              ("server", "AuthSession"),
              ("server", "ExecutionBoundary"),
              ("server", "WorkspaceSecurity"),
              ("server", "ChatUploadSecurity"),
          }
          seen = set()
          passed = set()
          for line in open(sys.argv[1], encoding="utf-8"):
              event = json.loads(line)
              name = event.get("Test", "")
              match = re.match(r"^Test(AuthSession|ExecutionBoundary|WorkspaceSecurity|ChatUploadSecurity)", name)
              if not match:
                  continue
              if event["Action"] in {"skip", "fail"}:
                  raise SystemExit(f"Security coverage was {event['Action']}: {event['Package']}.{name}")
              if event["Action"] == "pass":
                  seen.add((event["Package"].rsplit("/", 1)[-1], match.group(1)))
                  passed.add((event["Package"], name.split("/", 1)[0]))
          missing = expected - seen
          if missing:
              raise SystemExit(f"Missing required security coverage: {sorted(missing)}")
          print(f"Verified {len(passed)} security tests with PostgreSQL and the race detector; zero skipped.")
          PY

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on the ubuntu runners. -S warning: the scripts
      # currently have only info-level notes (intentional A && B || C chains in
      # update.sh, an unquoted glob in backup.sh's prune), so fail on warnings.
      - run: shellcheck -S warning install.sh update.sh start.sh reset-password.sh scripts/backup.sh scripts/bootstrap-postgres.sh scripts/security-compose-smoke.sh

  security-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the actual control-plane image
        run: docker build --tag artex:security-ci --build-arg ARTEX_VERSION=security-ci .
      - name: Verify Compose runtime and offline maintenance
        run: bash scripts/security-compose-smoke.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:auth
      - run: npx tsc --noEmit
      - run: npm run build:static
